<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sổ Sách Vui Xuân</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tet: {
              red: '#D72638',
              gold: '#FFC857',
              dark: '#1F2937',
              light: '#F3F4F6'
            }
          },
          animation: {
            'bounce-subtle': 'bounce-subtle 2s infinite',
            'fade-in': 'fadeIn 0.2s ease-out',
            'slide-up': 'slideInFromBottom 0.2s ease-out',
            'zoom-in': 'zoomIn 0.1s ease-out',
          },
          keyframes: {
            'bounce-subtle': {
              '0%, 100%': { transform: 'translateY(-2%)', animationTimingFunction: 'cubic-bezier(0.8, 0, 1, 1)' },
              '50%': { transform: 'translateY(0)', animationTimingFunction: 'cubic-bezier(0, 0, 0.2, 1)' },
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideInFromBottom: {
              '0%': { transform: 'translateY(100%)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            zoomIn: {
              '0%': { transform: 'scale(0.95)', opacity: '0' },
              '100%': { transform: 'scale(1)', opacity: '1' },
            }
          }
        }
      }
    }
  </script>

  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.572.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4"
  }
}
</script>
</head>
<body class="bg-gray-50 text-gray-900 select-none">
  <div id="root"></div>

  <!-- Main Application Script -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'https://esm.sh/react@18.2.0';
    import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
    import { 
      ChevronLeft, RotateCcw, Plus, X, User, Trophy, 
      Undo2, History, Zap, Settings, Save, Check, Minus, Copy, LogOut, AlertTriangle 
    } from 'https://esm.sh/lucide-react@0.344.0';

    // --- CONSTANTS & DEFAULTS ---
    const DEFAULT_TIENLEN_RULES = {
      FIRST: 5,
      SECOND: 3,
      THIRD: -3,
      LAST: -5,
      PIG_BLACK: 3,
      PIG_RED: 5,
    };

    // --- COMPONENT: BUTTON ---
    const Button = ({ children, variant = 'primary', fullWidth = false, className = '', ...props }) => {
      const baseStyles = "px-4 py-3 rounded-xl font-semibold transition-all active:scale-95 disabled:opacity-50 disabled:active:scale-100 touch-manipulation flex items-center justify-center";
      const variants = {
        primary: "bg-tet-red text-white shadow-lg shadow-red-200",
        secondary: "bg-tet-gold text-yellow-900 shadow-lg shadow-yellow-100",
        danger: "bg-red-100 text-red-600 border border-red-200",
        outline: "border-2 border-gray-200 text-gray-700 bg-white",
        ghost: "bg-transparent text-gray-500 hover:bg-gray-100"
      };
      return (
        <button className={`${baseStyles} ${variants[variant]} ${fullWidth ? 'w-full' : ''} ${className}`} {...props}>
          {children}
        </button>
      );
    };

    // --- COMPONENT: CONFIRM MODAL ---
    const ConfirmModal = ({ isOpen, title, message, onConfirm, onCancel, confirmText = "Đồng ý", cancelText = "Hủy" }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in">
          <div className="bg-white w-full max-w-xs rounded-2xl p-6 shadow-2xl animate-zoom-in">
            <div className="flex flex-col items-center text-center mb-6">
              <div className="w-12 h-12 bg-yellow-100 rounded-full flex items-center justify-center mb-3">
                <AlertTriangle className="w-6 h-6 text-yellow-600" />
              </div>
              <h3 className="text-lg font-bold text-gray-900">{title}</h3>
              <p className="text-sm text-gray-500 mt-2">{message}</p>
            </div>
            <div className="flex gap-3">
              <Button variant="ghost" onClick={onCancel} className="flex-1 bg-gray-100">{cancelText}</Button>
              <Button variant="danger" onClick={onConfirm} className="flex-1">{confirmText}</Button>
            </div>
          </div>
        </div>
      );
    };

    // --- COMPONENT: LAYOUT ---
    const Layout = ({ title, onBack, onReset, onEndSession, children }) => {
      const [confirmState, setConfirmState] = useState({ isOpen: false, type: null });

      const handleResetClick = () => setConfirmState({ isOpen: true, type: 'RESET' });
      const handleEndSessionClick = () => setConfirmState({ isOpen: true, type: 'END' });
      
      const handleConfirm = () => {
        if (confirmState.type === 'RESET' && onReset) onReset();
        if (confirmState.type === 'END' && onEndSession) onEndSession();
        setConfirmState({ isOpen: false, type: null });
      };

      return (
        <div className="min-h-screen flex flex-col bg-gray-50 max-w-md mx-auto shadow-2xl overflow-hidden relative border-x border-gray-100">
          <header className="bg-white border-b px-4 py-3 flex items-center justify-between sticky top-0 z-20 shadow-sm h-16">
            <div className="flex items-center gap-2 overflow-hidden">
              {onBack && (
                <button onClick={onBack} className="p-2 -ml-2 hover:bg-gray-100 rounded-full transition-colors shrink-0">
                  <ChevronLeft className="w-6 h-6 text-gray-600" />
                </button>
              )}
              <h1 className="text-xl font-bold text-gray-800 truncate">{title}</h1>
            </div>
            <div className="flex items-center gap-1 shrink-0">
              {onReset && (
                <button 
                  onClick={handleResetClick} 
                  className="p-2 text-gray-400 hover:text-tet-gold rounded-full transition-colors"
                  title="Chơi lại từ đầu (Giữ tên)"
                >
                  <RotateCcw className="w-5 h-5" />
                </button>
              )}
              {onEndSession && (
                <button 
                  onClick={handleEndSessionClick} 
                  className="p-2 -mr-2 text-gray-400 hover:text-red-600 rounded-full transition-colors"
                  title="Đổi bàn / Kết thúc"
                >
                  <LogOut className="w-5 h-5" />
                </button>
              )}
            </div>
          </header>
          <main className="flex-1 overflow-y-auto p-4 pb-24 no-scrollbar">
            {children}
          </main>

          <ConfirmModal 
            isOpen={confirmState.isOpen}
            onCancel={() => setConfirmState({ isOpen: false, type: null })}
            onConfirm={handleConfirm}
            title={confirmState.type === 'RESET' ? "Chơi lại từ đầu?" : "Kết thúc & Đổi bàn?"}
            message={confirmState.type === 'RESET' 
              ? "Điểm số sẽ về 0. Tên người chơi vẫn giữ nguyên." 
              : "Toàn bộ dữ liệu bàn chơi này sẽ bị xóa để nhập danh sách người chơi mới."}
            confirmText={confirmState.type === 'RESET' ? "Reset điểm" : "Xóa bàn"}
          />
        </div>
      );
    };

    // --- COMPONENT: SCOREBOARD ---
    const Scoreboard = ({ players, dealerId }) => {
      const sortedPlayers = [...players].sort((a, b) => b.score - a.score);
      return (
        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-6">
          <div className="bg-gray-50 px-4 py-2 border-b border-gray-100 flex justify-between items-center">
            <span className="text-xs font-bold text-gray-500 uppercase tracking-wider">Bảng Tổng Sắp</span>
            <Trophy className="w-4 h-4 text-tet-gold" />
          </div>
          <div className="divide-y divide-gray-100">
            {sortedPlayers.map((p, idx) => (
              <div key={p.id} className="flex items-center justify-between px-4 py-3">
                <div className="flex items-center gap-3">
                  <span className={`text-sm font-bold w-6 ${idx === 0 ? 'text-tet-gold text-lg' : 'text-gray-400'}`}>#{idx + 1}</span>
                  <div>
                    <span className="font-semibold text-gray-900">{p.name}</span>
                    {dealerId === p.id && <span className="ml-2 text-[10px] bg-gray-800 text-white px-1.5 py-0.5 rounded align-middle">CÁI</span>}
                  </div>
                </div>
                <span className={`font-mono font-bold text-lg ${p.score >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                  {p.score > 0 ? '+' : ''}{p.score}
                </span>
              </div>
            ))}
          </div>
        </div>
      );
    };

    // --- COMPONENT: PLAYER SETUP ---
    const PlayerSetup = ({ onStart, gameMode }) => {
      const [players, setPlayers] = useState([]);
      const [newName, setNewName] = useState('');
      const [dealerId, setDealerId] = useState('');

      const addPlayer = () => {
        if (!newName.trim()) return;
        const newPlayer = { id: Date.now().toString(), name: newName.trim(), score: 0 };
        const updatedPlayers = [...players, newPlayer];
        setPlayers(updatedPlayers);
        if (gameMode === 'XIDACH' && players.length === 0) setDealerId(newPlayer.id);
        setNewName('');
      };

      const removePlayer = (id) => {
        const updatedPlayers = players.filter(p => p.id !== id);
        setPlayers(updatedPlayers);
        if (gameMode === 'XIDACH' && dealerId === id && updatedPlayers.length > 0) setDealerId(updatedPlayers[0].id);
      };

      const handleStart = () => {
        if (gameMode === 'XIDACH') onStart(players, dealerId);
        else onStart(players);
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 animate-fade-in">
            <h2 className="text-lg font-semibold mb-4 flex items-center gap-2"><User className="w-5 h-5 text-tet-red" /> Điểm danh người chơi</h2>
            <div className="flex gap-2 mb-6">
              <input type="text" value={newName} onChange={(e) => setNewName(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && addPlayer()} placeholder="Nhập tên..." className="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 outline-none focus:border-tet-red focus:ring-1 focus:ring-tet-red transition-all" />
              <Button onClick={addPlayer} disabled={!newName.trim()}><Plus className="w-6 h-6" /></Button>
            </div>
            <div className="space-y-2 max-h-[40vh] overflow-y-auto">
              {players.length === 0 && <div className="text-center py-4 text-gray-400 text-sm italic">Chưa có ai. Thêm tên để bắt đầu!</div>}
              {players.map((p) => (
                <div key={p.id} className="flex items-center justify-between bg-gray-50 p-3 rounded-xl animate-fade-in">
                  <div className="flex items-center gap-3">
                    {gameMode === 'XIDACH' && (
                       <div onClick={() => setDealerId(p.id)} className={`w-6 h-6 rounded-full border-2 flex items-center justify-center cursor-pointer transition-colors ${dealerId === p.id ? 'border-tet-red bg-tet-red' : 'border-gray-300'}`}>
                         {dealerId === p.id && <div className="w-2 h-2 bg-white rounded-full" />}
                       </div>
                    )}
                    <span className="font-medium">{p.name} {gameMode === 'XIDACH' && dealerId === p.id && <span className="text-xs text-tet-red font-bold">(Nhà Cái)</span>}</span>
                  </div>
                  <button onClick={() => removePlayer(p.id)} className="text-gray-400 hover:text-red-500 p-2"><X className="w-5 h-5" /></button>
                </div>
              ))}
            </div>
            {gameMode === 'XIDACH' && players.length > 0 && <p className="text-xs text-center text-gray-400 mt-4">Chạm vào hình tròn để chọn Nhà Cái</p>}
          </div>
          <div className="sticky bottom-4">
            <Button fullWidth onClick={handleStart} disabled={players.length < 2}>Bắt đầu chơi ({players.length} người)</Button>
          </div>
        </div>
      );
    };

    // --- COMPONENT: TIEN LEN GAME ---
    const TienLenGame = ({ initialPlayers, onBack }) => {
      const [gameState, setGameState] = useState(() => {
        const saved = localStorage.getItem('tienlen_state');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (!parsed.tienLenRules) parsed.tienLenRules = DEFAULT_TIENLEN_RULES;
          return parsed;
        }
        return { players: initialPlayers, history: [], tienLenRules: DEFAULT_TIENLEN_RULES };
      });

      const [inputMode, setInputMode] = useState('NONE');
      const [selectedRanks, setSelectedRanks] = useState([]);
      const [pigCutter, setPigCutter] = useState(null);
      const [pigVictim, setPigVictim] = useState(null);
      const [editingRules, setEditingRules] = useState(DEFAULT_TIENLEN_RULES);

      useEffect(() => { localStorage.setItem('tienlen_state', JSON.stringify(gameState)); }, [gameState]);

      const rules = gameState.tienLenRules || DEFAULT_TIENLEN_RULES;

      const updateScores = (changes, description) => {
        const newPlayers = gameState.players.map(p => ({ ...p, score: p.score + (changes[p.id] || 0) }));
        const newRound = { id: Date.now().toString(), timestamp: Date.now(), description, scoreChanges: changes };
        setGameState({ ...gameState, players: newPlayers, history: [newRound, ...gameState.history] });
      };

      const handleRankSelection = (playerId) => {
        if (selectedRanks.includes(playerId)) setSelectedRanks(selectedRanks.filter(id => id !== playerId));
        else setSelectedRanks([...selectedRanks, playerId]);
      };

      const submitRanking = () => {
        const changes = {};
        const count = selectedRanks.length;
        if (count < 2) return;
        changes[selectedRanks[0]] = rules.FIRST;
        changes[selectedRanks[count - 1]] = rules.LAST;
        if (count >= 4) {
          changes[selectedRanks[1]] = rules.SECOND;
          changes[selectedRanks[2]] = rules.THIRD;
        } else if (count === 3) {
          changes[selectedRanks[1]] = 0;
        }
        updateScores(changes, 'Xếp hạng');
        setInputMode('NONE');
        setSelectedRanks([]);
      };

      const submitPig = (type) => {
        if (!pigCutter || !pigVictim) return;
        const points = type === 'BLACK' ? rules.PIG_BLACK : rules.PIG_RED;
        const typeName = type === 'BLACK' ? 'Heo Đen' : 'Heo Đỏ';
        const changes = {};
        changes[pigCutter] = points;
        changes[pigVictim] = -points;
        updateScores(changes, `Chặt ${typeName}`);
      };

      const saveSettings = () => {
        setGameState({ ...gameState, tienLenRules: editingRules });
        setInputMode('NONE');
      };

      const undoLast = () => {
        if (gameState.history.length === 0) return;
        const lastRound = gameState.history[0];
        const newPlayers = gameState.players.map(p => ({ ...p, score: p.score - (lastRound.scoreChanges[p.id] || 0) }));
        setGameState({ ...gameState, players: newPlayers, history: gameState.history.slice(1) });
      };

      const resetGame = () => {
        setGameState({ ...gameState, players: gameState.players.map(p => ({ ...p, score: 0 })), history: [] });
      };
      
      const endSession = () => {
          localStorage.removeItem('tienlen_state');
          onBack(); 
      }

      return (
        <Layout title="Tiến Lên" onBack={onBack} onReset={resetGame} onEndSession={endSession}>
          <Scoreboard players={gameState.players} />
          <div className="grid grid-cols-2 gap-3 mb-6">
            <Button onClick={() => setInputMode('RANKING')} className="h-24 flex flex-col items-center justify-center gap-2"><span className="text-2xl">🏆</span><span>Xếp Hạng</span></Button>
            <div className="flex flex-col gap-3">
              <Button variant="secondary" onClick={() => setInputMode('PIG')} className="flex-1 flex items-center justify-center gap-2"><span className="text-xl">🐷</span><span>Chặt Heo</span></Button>
              <Button variant="outline" onClick={() => { setEditingRules(rules); setInputMode('SETTINGS'); }} className="h-12 flex items-center justify-center gap-2 text-sm"><Settings className="w-4 h-4" /> Luật Chơi</Button>
            </div>
          </div>
          <div className="space-y-4">
             <div className="flex items-center justify-between px-2">
                <h3 className="font-bold text-gray-500 text-sm uppercase flex items-center gap-2"><History className="w-4 h-4" /> Nhật ký</h3>
                <button onClick={undoLast} disabled={gameState.history.length === 0} className="text-sm text-blue-600 font-medium disabled:opacity-30 flex items-center gap-1"><Undo2 className="w-4 h-4" /> Hoàn tác</button>
             </div>
             <div className="space-y-2">
                {gameState.history.map(round => (
                  <div key={round.id} className="bg-white p-3 rounded-xl border border-gray-100 text-sm animate-fade-in">
                    <div className="flex justify-between text-gray-500 text-xs mb-1">
                      <span>{new Date(round.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                      <span className="font-medium">{round.description}</span>
                    </div>
                    <div className="flex flex-wrap gap-x-4 gap-y-1">
                      {Object.entries(round.scoreChanges).map(([pid, value]) => {
                        const score = value;
                        if (score === 0) return null;
                        const pName = gameState.players.find(p => p.id === pid)?.name;
                        return <span key={pid} className={`${score > 0 ? 'text-green-600' : 'text-red-600'} font-medium`}>{pName}: {score > 0 ? '+' : ''}{score}</span>;
                      })}
                    </div>
                  </div>
                ))}
                {gameState.history.length === 0 && <div className="text-center py-8 text-gray-400 text-sm">Chưa có ván nào.</div>}
             </div>
          </div>

          {/* Ranking Modal */}
          {inputMode === 'RANKING' && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm">
              <div className="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-6 shadow-2xl animate-slide-up">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-xl font-bold">Kết quả ván đấu</h2>
                  <button onClick={() => { setInputMode('NONE'); setSelectedRanks([]); }} className="p-2 bg-gray-100 rounded-full"><X className="w-5 h-5" /></button>
                </div>
                <div className="space-y-3 mb-6">
                  <p className="text-sm text-gray-500 mb-2">Chọn theo thứ tự về Nhất, Nhì...</p>
                  <div className="grid grid-cols-2 gap-3">
                    {gameState.players.map(p => {
                      const rankIndex = selectedRanks.indexOf(p.id);
                      const isSelected = rankIndex !== -1;
                      return (
                        <button key={p.id} onClick={() => handleRankSelection(p.id)} className={`p-4 rounded-xl font-semibold text-left relative transition-all ${isSelected ? 'bg-tet-gold/20 border-2 border-tet-gold text-yellow-900' : 'bg-gray-50 border-2 border-transparent text-gray-700'}`}>
                          {p.name}
                          {isSelected && <div className="absolute top-2 right-2 bg-tet-gold text-white w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold shadow-sm">{rankIndex + 1}</div>}
                        </button>
                      );
                    })}
                  </div>
                </div>
                <div className="flex gap-3">
                   <Button variant="ghost" onClick={() => setSelectedRanks([])} className="flex-1">Xóa</Button>
                   <Button onClick={submitRanking} className="flex-[2]" disabled={selectedRanks.length < 2}>Lưu kết quả</Button>
                </div>
              </div>
            </div>
          )}

          {/* Pig Modal */}
          {inputMode === 'PIG' && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm">
              <div className="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-6 shadow-2xl animate-slide-up">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-xl font-bold flex items-center gap-2"><Zap className="w-5 h-5 text-yellow-500" /> Tính Điểm Chặt Heo</h2>
                  <button onClick={() => { setInputMode('NONE'); setPigCutter(null); setPigVictim(null); }} className="p-2 bg-gray-100 rounded-full"><X className="w-5 h-5" /></button>
                </div>
                <div className="grid grid-cols-2 gap-6 mb-8">
                  <div className="space-y-2">
                    <label className="text-xs font-bold text-green-600 uppercase">Người Chặt (Ăn)</label>
                    <div className="flex flex-col gap-2">
                      {gameState.players.map(p => (
                        <button key={`winner-${p.id}`} onClick={() => setPigCutter(p.id)} disabled={pigVictim === p.id} className={`p-2 rounded-lg text-sm font-medium transition-colors ${pigCutter === p.id ? 'bg-green-100 text-green-700 ring-2 ring-green-500' : 'bg-gray-50 text-gray-600'}`}>
                          {p.name}
                        </button>
                      ))}
                    </div>
                  </div>
                  <div className="space-y-2">
                    <label className="text-xs font-bold text-red-600 uppercase">Người Bị Chặt (Thua)</label>
                    <div className="flex flex-col gap-2">
                      {gameState.players.map(p => (
                        <button key={`loser-${p.id}`} onClick={() => setPigVictim(p.id)} disabled={pigCutter === p.id} className={`p-2 rounded-lg text-sm font-medium transition-colors ${pigVictim === p.id ? 'bg-red-100 text-red-700 ring-2 ring-red-500' : 'bg-gray-50 text-gray-600'}`}>
                          {p.name}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <Button onClick={() => submitPig('BLACK')} disabled={!pigCutter || !pigVictim} className="bg-gray-800 text-white shadow-gray-300">+{rules.PIG_BLACK} Heo Đen</Button>
                  <Button onClick={() => submitPig('RED')} disabled={!pigCutter || !pigVictim} variant="primary">+{rules.PIG_RED} Heo Đỏ</Button>
                </div>
              </div>
            </div>
          )}

          {/* Settings Modal - FIXED SECTION */}
          {inputMode === 'SETTINGS' && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm">
              <div className="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-6 shadow-2xl animate-slide-up max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-xl font-bold flex items-center gap-2"><Settings className="w-5 h-5 text-gray-600" /> Cài Đặt Luật</h2>
                  <button onClick={() => setInputMode('NONE')} className="p-2 bg-gray-100 rounded-full"><X className="w-5 h-5" /></button>
                </div>

                <div className="space-y-6 mb-6">
                  <div>
                    <h3 className="font-bold text-sm text-gray-400 uppercase mb-3">Điểm Xếp Hạng</h3>
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="text-xs font-medium text-gray-600">Nhất (Cộng)</label>
                        <input type="number" value={editingRules.FIRST} onChange={e => setEditingRules({...editingRules, FIRST: Number(e.target.value)})} className="w-full mt-1 p-2 border rounded-lg font-mono text-green-600" />
                      </div>
                      <div>
                        <label className="text-xs font-medium text-gray-600">Nhì (Cộng)</label>
                        <input type="number" value={editingRules.SECOND} onChange={e => setEditingRules({...editingRules, SECOND: Number(e.target.value)})} className="w-full mt-1 p-2 border rounded-lg font-mono text-blue-600" />
                      </div>
                      
                      {/* FIXED: 3rd Place - Display absolute (positive), store negative */}
                      <div>
                        <label className="text-xs font-medium text-gray-600">Ba (Trừ)</label>
                        <div className="relative">
                           <span className="absolute left-3 top-1/2 -translate-y-1/2 text-orange-600 font-bold">-</span>
                           <input 
                              type="number" 
                              value={Math.abs(editingRules.THIRD)} 
                              onChange={e => setEditingRules({...editingRules, THIRD: -Math.abs(Number(e.target.value))})} 
                              className="w-full mt-1 p-2 pl-6 border rounded-lg font-mono text-orange-600" 
                           />
                        </div>
                      </div>

                      {/* FIXED: Last Place - Display absolute (positive), store negative */}
                      <div>
                        <label className="text-xs font-medium text-gray-600">Chót (Trừ)</label>
                        <div className="relative">
                            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-red-600 font-bold">-</span>
                            <input 
                                type="number" 
                                value={Math.abs(editingRules.LAST)} 
                                onChange={e => setEditingRules({...editingRules, LAST: -Math.abs(Number(e.target.value))})} 
                                className="w-full mt-1 p-2 pl-6 border rounded-lg font-mono text-red-600" 
                            />
                        </div>
                      </div>
                    </div>
                  </div>
                  <div>
                    <h3 className="font-bold text-sm text-gray-400 uppercase mb-3">Điểm Phạt</h3>
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="text-xs font-medium text-gray-600">Heo Đen</label>
                        <input type="number" value={editingRules.PIG_BLACK} onChange={e => setEditingRules({...editingRules, PIG_BLACK: Number(e.target.value)})} className="w-full mt-1 p-2 border rounded-lg font-mono" />
                      </div>
                      <div>
                        <label className="text-xs font-medium text-gray-600">Heo Đỏ</label>
                        <input type="number" value={editingRules.PIG_RED} onChange={e => setEditingRules({...editingRules, PIG_RED: Number(e.target.value)})} className="w-full mt-1 p-2 border rounded-lg font-mono text-tet-red" />
                      </div>
                    </div>
                  </div>
                </div>

                <Button fullWidth onClick={saveSettings}>
                   <Save className="w-5 h-5 mr-2 inline" /> Lưu Luật
                </Button>
              </div>
            </div>
          )}
        </Layout>
      );
    };

    // --- COMPONENT: XI DACH GAME ---
    const XiDachGame = ({ initialPlayers, dealerId, onBack }) => {
      const [gameState, setGameState] = useState(() => {
        const saved = localStorage.getItem('xidach_state');
        const parsed = saved ? JSON.parse(saved) : { players: initialPlayers, history: [], dealerId };
        if (!parsed.defaultBets) parsed.defaultBets = {};
        return parsed;
      });

      const [bets, setBets] = useState({}); 
      const [results, setResults] = useState({});
      const [multipliers, setMultipliers] = useState({});
      const [isRoundOpen, setIsRoundOpen] = useState(false);

      useEffect(() => { localStorage.setItem('xidach_state', JSON.stringify(gameState)); }, [gameState]);

      useEffect(() => {
        if (isRoundOpen) {
           const initialBets = {};
           const initialResults = {};
           const initialMultipliers = {};
           gameState.players.forEach(p => {
             if (p.id !== dealerId) {
                initialBets[p.id] = (gameState.defaultBets?.[p.id] || 10).toString();
                initialResults[p.id] = 'LOSE';
                initialMultipliers[p.id] = 1;
             }
           });
           setBets(initialBets);
           setResults(initialResults);
           setMultipliers(initialMultipliers);
        }
      }, [isRoundOpen]);

      const updateScores = (changes, description) => {
        const newPlayers = gameState.players.map(p => ({ ...p, score: p.score + (changes[p.id] || 0) }));
        const newRound = { id: Date.now().toString(), timestamp: Date.now(), description, scoreChanges: changes };
        setGameState(prev => ({ ...prev, players: newPlayers, history: [newRound, ...prev.history] }));
      };

      const submitRound = () => {
        const changes = {};
        const newDefaultBets = { ...(gameState.defaultBets || {}) };
        let dealerDelta = 0;
        gameState.players.forEach(p => {
          if (p.id === dealerId) return;
          const betAmount = parseInt(bets[p.id] || '0', 10);
          newDefaultBets[p.id] = betAmount;
          const result = results[p.id];
          const mult = multipliers[p.id] || 1;
          const finalAmount = betAmount * mult;
          if (betAmount > 0) {
            if (result === 'WIN') { changes[p.id] = finalAmount; dealerDelta -= finalAmount; }
            else if (result === 'LOSE') { changes[p.id] = -finalAmount; dealerDelta += finalAmount; }
          }
        });
        changes[dealerId] = dealerDelta;
        setGameState(prev => ({ ...prev, defaultBets: newDefaultBets }));
        updateScores(changes, 'Kết quả ván');
        setIsRoundOpen(false);
      };

      const undoLast = () => {
        if (gameState.history.length === 0) return;
        const lastRound = gameState.history[0];
        const newPlayers = gameState.players.map(p => ({ ...p, score: p.score - (lastRound.scoreChanges[p.id] || 0) }));
        setGameState({ ...gameState, players: newPlayers, history: gameState.history.slice(1) });
      };

      const resetGame = () => {
        setGameState({ ...gameState, players: gameState.players.map(p => ({ ...p, score: 0 })), history: [] });
      };

      const endSession = () => {
          localStorage.removeItem('xidach_state');
          onBack(); 
      }

      const toggleMultiplier = (pid, val) => { setMultipliers(prev => ({...prev, [pid]: prev[pid] === val ? 1 : val})); }
      const setAllResults = (type) => {
          const newResults = {};
          gameState.players.forEach(p => { if (p.id !== dealerId) newResults[p.id] = type; });
          setResults(newResults);
      }
      const applyBetToAll = (amount) => {
          const newBets = {};
          gameState.players.forEach(p => { if (p.id !== dealerId) newBets[p.id] = amount; });
          setBets(newBets);
      }

      return (
        <Layout title="Xì Dách" onBack={onBack} onReset={resetGame} onEndSession={endSession}>
          <Scoreboard players={gameState.players} dealerId={dealerId} />
          {!isRoundOpen ? (
            <div className="mb-6 space-y-3">
              <Button fullWidth onClick={() => setIsRoundOpen(true)} className="h-16 text-lg shadow-xl animate-bounce-subtle">Bắt đầu ván mới</Button>
              <p className="text-center text-xs text-gray-400">Điểm cược sẽ tự động lưu lại cho ván sau.</p>
            </div>
          ) : (
            <div className="fixed inset-0 bg-gray-50 z-50 flex flex-col">
               <div className="bg-white border-b px-4 py-3 flex items-center justify-between shadow-sm shrink-0">
                  <h2 className="font-bold text-lg">Nhập kết quả</h2>
                  <button onClick={() => setIsRoundOpen(false)} className="p-2 bg-gray-100 rounded-full"><X className="w-5 h-5" /></button>
               </div>
               <div className="bg-gray-100 px-4 py-2 flex gap-2 overflow-x-auto shrink-0 border-b no-scrollbar">
                   <button onClick={() => setAllResults('LOSE')} className="flex items-center gap-1 px-3 py-1.5 bg-red-100 text-red-700 rounded-lg text-xs font-bold whitespace-nowrap"><Zap className="w-3 h-3" /> Cái ăn hết</button>
                   <button onClick={() => setAllResults('DRAW')} className="flex items-center gap-1 px-3 py-1.5 bg-yellow-100 text-yellow-700 rounded-lg text-xs font-bold whitespace-nowrap">Hòa hết</button>
                   <div className="w-px h-6 bg-gray-300 mx-1"></div>
                   <button onClick={() => { const firstVal = Object.values(bets)[0]; if(typeof firstVal === 'string') applyBetToAll(firstVal); }} className="flex items-center gap-1 px-3 py-1.5 bg-white text-gray-600 border border-gray-200 rounded-lg text-xs font-bold whitespace-nowrap"><Copy className="w-3 h-3" /> Copy điểm cược</button>
               </div>
               <div className="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar">
                  {gameState.players.filter(p => p.id !== dealerId).map(p => (
                    <div key={p.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                      <div className="flex justify-between items-center mb-3">
                        <span className="font-bold text-lg truncate max-w-[150px]">{p.name}</span>
                        <div className="flex items-center gap-1 bg-gray-50 px-3 py-1 rounded-lg border border-gray-100 focus-within:ring-2 focus-within:ring-tet-red/20 focus-within:border-tet-red transition-all">
                          <input type="number" inputMode="numeric" value={bets[p.id] || ''} onChange={(e) => setBets({...bets, [p.id]: e.target.value})} className="w-16 text-right font-mono font-bold bg-transparent outline-none text-gray-900" />
                          <span className="text-gray-400 text-xs font-bold">điểm</span>
                        </div>
                      </div>
                      <div className="flex flex-col gap-3">
                        <div className="grid grid-cols-3 gap-2">
                          <button onClick={() => setResults({...results, [p.id]: 'LOSE'})} className={`py-3 rounded-lg font-bold text-sm flex flex-col items-center gap-1 transition-all ${results[p.id] === 'LOSE' ? 'bg-red-500 text-white shadow-md shadow-red-200' : 'bg-gray-50 text-gray-400 hover:bg-gray-100'}`}><X className="w-5 h-5" /> Thua</button>
                           <button onClick={() => setResults({...results, [p.id]: 'DRAW'})} className={`py-3 rounded-lg font-bold text-sm flex flex-col items-center gap-1 transition-all ${results[p.id] === 'DRAW' ? 'bg-yellow-400 text-yellow-900 shadow-md shadow-yellow-200' : 'bg-gray-50 text-gray-400 hover:bg-gray-100'}`}><Minus className="w-5 h-5" /> Hòa</button>
                          <button onClick={() => setResults({...results, [p.id]: 'WIN'})} className={`py-3 rounded-lg font-bold text-sm flex flex-col items-center gap-1 transition-all ${results[p.id] === 'WIN' ? 'bg-green-500 text-white shadow-md shadow-green-200' : 'bg-gray-50 text-gray-400 hover:bg-gray-100'}`}><Check className="w-5 h-5" /> Thắng</button>
                        </div>
                        {results[p.id] !== 'DRAW' && (
                            <div className="flex gap-2 animate-fade-in">
                               <button onClick={() => toggleMultiplier(p.id, 2)} className={`flex-1 py-1.5 rounded-lg text-xs font-bold border transition-all ${multipliers[p.id] === 2 ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' : 'bg-white text-gray-400 border-gray-200'}`}>x2 (Xì Dách)</button>
                               <button onClick={() => toggleMultiplier(p.id, 3)} className={`flex-1 py-1.5 rounded-lg text-xs font-bold border transition-all ${multipliers[p.id] === 3 ? 'bg-purple-600 text-white border-purple-600 shadow-sm' : 'bg-white text-gray-400 border-gray-200'}`}>x3 (Xì Bàn)</button>
                            </div>
                        )}
                      </div>
                    </div>
                  ))}
               </div>
               <div className="p-4 bg-white border-t shrink-0">
                 <Button fullWidth onClick={submitRound}>Xác nhận</Button>
               </div>
            </div>
          )}
          <div className="space-y-4">
             <div className="flex items-center justify-between px-2">
                <h3 className="font-bold text-gray-500 text-sm uppercase flex items-center gap-2"><History className="w-4 h-4" /> Nhật ký</h3>
                <button onClick={undoLast} disabled={gameState.history.length === 0} className="text-sm text-blue-600 font-medium disabled:opacity-30 flex items-center gap-1"><Undo2 className="w-4 h-4" /> Hoàn tác</button>
             </div>
             <div className="space-y-2">
                {gameState.history.map(round => (
                  <div key={round.id} className="bg-white p-3 rounded-xl border border-gray-100 text-sm animate-fade-in">
                    <div className="flex justify-between text-gray-500 text-xs mb-1">
                      <span>{new Date(round.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                      <span className="font-medium">Kết quả ván</span>
                    </div>
                    <div className="grid grid-cols-2 gap-x-4 gap-y-1">
                      {Object.entries(round.scoreChanges).map(([pid, value]) => {
                        const score = value;
                        const pName = gameState.players.find(p => p.id === pid)?.name;
                        return (
                          <div key={pid} className="flex justify-between">
                             <span>{pName}</span>
                             <span className={`${score > 0 ? 'text-green-600' : score < 0 ? 'text-red-600' : 'text-gray-400'} font-mono`}>{score > 0 ? '+' : ''}{score}</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ))}
             </div>
          </div>
        </Layout>
      );
    };

    // --- COMPONENT: GAME SELECTOR ---
    const GameSelector = ({ onSelect }) => {
      return (
        <div className="min-h-screen bg-tet-light flex items-center justify-center p-6">
          <div className="w-full max-w-sm space-y-8">
            <div className="text-center space-y-2">
              <div className="inline-block bg-tet-red rounded-2xl p-4 shadow-xl mb-4 rotate-3"><span className="text-4xl">🧧</span></div>
              <h1 className="text-4xl font-black text-gray-900 tracking-tight">Sổ Sách<br/><span className="text-tet-red">Vui Xuân</span></h1>
              <p className="text-gray-500">Ghi điểm giải trí, lộc xuân sum vầy.</p>
            </div>
            <div className="space-y-4">
              <div onClick={() => onSelect('TIENLEN')} className="group relative bg-white rounded-2xl p-6 shadow-sm border-2 border-transparent hover:border-tet-red transition-all cursor-pointer active:scale-95">
                <div className="absolute top-4 right-4 text-3xl opacity-20 group-hover:opacity-100 transition-opacity">♠️</div>
                <h3 className="text-xl font-bold text-gray-900 mb-1">Tiến Lên</h3>
                <p className="text-sm text-gray-500">Ghi điểm đánh bài.</p>
              </div>
              <div onClick={() => onSelect('XIDACH')} className="group relative bg-white rounded-2xl p-6 shadow-sm border-2 border-transparent hover:border-tet-red transition-all cursor-pointer active:scale-95">
                <div className="absolute top-4 right-4 text-3xl opacity-20 group-hover:opacity-100 transition-opacity">🃏</div>
                <h3 className="text-xl font-bold text-gray-900 mb-1">Xì Dách</h3>
                <p className="text-sm text-gray-500">Tính điểm nhanh.</p>
              </div>
            </div>
            <p className="text-center text-xs text-gray-400 mt-8">Điểm được lưu tự động trên máy của bạn.</p>
          </div>
        </div>
      );
    };

    // --- MAIN APP COMPONENT ---
    const App = () => {
      const [mode, setMode] = useState('HOME');
      const [players, setPlayers] = useState([]);
      const [dealerId, setDealerId] = useState('');
      const [step, setStep] = useState('SELECT_GAME');

      const handleGameSelect = (selectedMode) => {
        setMode(selectedMode);
        const savedState = localStorage.getItem(selectedMode === 'TIENLEN' ? 'tienlen_state' : 'xidach_state');
        if (savedState) setStep('PLAYING');
        else setStep('SETUP_PLAYERS');
      };

      const handleStartGame = (setupPlayers, dealer) => {
        setPlayers(setupPlayers);
        if (dealer) setDealerId(dealer);
        setStep('PLAYING');
      };

      const handleBack = () => {
        setStep('SELECT_GAME');
        setMode('HOME');
        setPlayers([]);
      };

      if (step === 'SELECT_GAME') return <GameSelector onSelect={handleGameSelect} />;
      if (step === 'SETUP_PLAYERS') return <Layout title={`Thiết lập ${mode === 'TIENLEN' ? 'Tiến Lên' : 'Xì Dách'}`} onBack={handleBack}><PlayerSetup onStart={handleStartGame} gameMode={mode} /></Layout>;
      if (mode === 'TIENLEN') return <TienLenGame initialPlayers={players} onBack={handleBack} />;
      if (mode === 'XIDACH') return <XiDachGame initialPlayers={players} dealerId={dealerId} onBack={handleBack} />;
      return null;
    };

    // --- RENDER ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
